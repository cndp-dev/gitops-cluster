apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: crossplane-providers
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  generators:
    - git:
        repoURL: https://github.com/cndp-dev/gitops-cluster
        revision: HEAD
        directories:
          - path: crossplane/*
  template:
    metadata:
      name: {{.path.basename}}
    spec:
      project: default
      source:
        repoURL: https://github.com/cndp-dev/gitops-cluster
        targetRevision: HEAD
        path: {{.path.path}}
      destination:
        server: https://kubernetes.default.svc
        namespace: crossplane-system
      syncPolicy:
        automated:
          prune: true    
        syncOptions:
        - CreateNamespace=true
        retry:
          limit: 1
          backoff:
            duration: 5s 
            factor: 2 
            maxDuration: 1m